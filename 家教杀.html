<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家庭阵地战：初一少年的逆袭 (三国杀卡牌对战版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;800;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      background-color: #030712;
      color: #f8fafc;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      margin: 0;
    }

    /* 适配 iPad 11" (1194x834) 和 MacBook Pro 13" (1280x800) 等小屏幕 */
    .game-viewport {
      height: 100vh;
      max-height: 840px;
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      gap: 0.4rem;
      position: relative;
    }

    /* 受击震动与红闪动画 */
    @keyframes hitShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 4px) rotate(-1deg); }
      40% { transform: translate(8px, -4px) rotate(1deg); }
      60% { transform: translate(-5px, 2px); }
      80% { transform: translate(5px, -2px); }
    }
    .animate-shake { animation: hitShake 0.4s ease-in-out; }

    /* 装备穿戴光效脉冲 */
    @keyframes equipPulse {
      0% { box-shadow: 0 0 0px rgba(245, 158, 11, 0); transform: scale(1); }
      50% { box-shadow: 0 0 18px rgba(245, 158, 11, 0.8); transform: scale(1.05); }
      100% { box-shadow: 0 0 0px rgba(245, 158, 11, 0); transform: scale(1); }
    }
    .equip-active { animation: equipPulse 0.6s ease-in-out; }

    /* 耳机护盾脉冲动画 */
    @keyframes headphonePulse {
      0% { box-shadow: 0 0 0px rgba(56, 189, 248, 0); transform: scale(1); }
      50% { box-shadow: 0 0 25px rgba(56, 189, 248, 0.95); transform: scale(1.06); }
      100% { box-shadow: 0 0 0px rgba(56, 189, 248, 0); transform: scale(1); }
    }
    .headphone-active { animation: headphonePulse 0.8s ease-in-out; }

    /* 浮动伤害与治疗数字动画 */
    @keyframes floatTextAnim {
      0% { opacity: 0; transform: translateY(10px) scale(0.7); }
      20% { opacity: 1; transform: translateY(-10px) scale(1.3); }
      80% { opacity: 1; transform: translateY(-35px) scale(1); }
      100% { opacity: 0; transform: translateY(-50px) scale(0.8); }
    }
    .floating-num {
      position: absolute;
      font-weight: 900;
      font-size: 1.8rem;
      pointer-events: none;
      z-index: 60;
      animation: floatTextAnim 1.1s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    /* 出牌飞入中央特效 */
    @keyframes cardPlayAnim {
      0% { transform: scale(0.3) translateY(120px) rotate(-10deg); opacity: 0; }
      50% { transform: scale(1.2) translateY(0) rotate(0deg); opacity: 1; filter: drop-shadow(0 0 20px #f59e0b); }
      80% { transform: scale(1.05) translateY(0); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .card-played-active {
      animation: cardPlayAnim 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* 回合切换横幅滑入 */
    @keyframes bannerSlide {
      0% { transform: translateX(-100%) scaleX(0.5); opacity: 0; }
      25% { transform: translateX(0) scaleX(1); opacity: 1; }
      75% { transform: translateX(0) scaleX(1); opacity: 1; }
      100% { transform: translateX(100%) scaleX(0.5); opacity: 0; }
    }
    .animate-banner {
      animation: bannerSlide 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 美化滚动条 */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    /* 手牌悬停与交互 */
    .card-item {
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: bottom center;
    }
    .card-item:hover {
      transform: translateY(-12px) scale(1.08);
      z-index: 30;
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .equip-slot {
      background: rgba(15, 23, 42, 0.7);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }
    .equip-slot.filled {
      border-style: solid;
      border-color: rgba(245, 158, 11, 0.5);
      background: rgba(245, 158, 11, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center">

<div class="game-viewport w-full" id="game-app">

  <!-- 顶部：电脑对手面板 -->

      </div>
      <div>

    <!-- 战报实况日志 (占7列) -->

      <div class="flex items-center gap-2.5">
        <!-- 少年头像 -->

            👦

        <div>

        </div>

<div id="prompt-modal-overlay" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">

      🔄 重新对局 (随机更换长辈)
    </button>
  </div>
</div>

<script>
  // ==========================================
  // Web Audio API 原生音频合成引擎
  // ==========================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.enabled = true;
    }

    init() {
      if (!this.ctx) {
        const AudioCtxFunc = window.AudioContext || window.webkitAudioContext;
        if (AudioCtxFunc) {
          this.ctx = new AudioCtxFunc();
        }
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    toggleSound() {
      this.enabled = !this.enabled;
      return this.enabled;
    }

    // 摸牌音效
    playWhoosh() {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      const ctx = this.ctx;
      const bufferSize = ctx.sampleRate * 0.12;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(400, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(1800, ctx.currentTime + 0.12);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start();
    }

    // 点击/打牌音效
    playSnap() {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(700, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.06);

      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.06);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.06);

      osc2.connect(gain);

  // 悔一步（撤销）历史栈
  let stateHistory = [];

  // ==========================================
  // 快照记录与悔一步撤销功能
  // ==========================================
  function saveStateSnapshot() {
    if (currentTurn !== 'player') return;
    const snapshot = {
      player: JSON.parse(JSON.stringify(player)),
      ai: JSON.parse(JSON.stringify(ai)),
      deck: [...deck],
      discardPile: [...discardPile],
      battleLogHTML: document.getElementById('battle-log').innerHTML,
      lastCardDisplayHTML: document.getElementById('last-card-display').innerHTML
    };
    stateHistory.push(snapshot);
    if (stateHistory.length > 6) stateHistory.shift(); // 保留最近6步
    updateUndoButtonState();
  }

  function undoStep() {
    if (stateHistory.length === 0 || currentTurn !== 'player') return;
    soundEngine.playUndo();

    const previous = stateHistory.pop();
    player = previous.player;
    ai = previous.ai;
    deck = previous.deck;
    discardPile = previous.discardPile;

    document.getElementById('battle-log').innerHTML = previous.battleLogHTML;
    document.getElementById('last-card-display').innerHTML = previous.lastCardDisplayHTML;

    addLog("↺ 触发【悔一步】！成功撤销刚才的操作，恢复历史状态。", "system");
    renderAllUI();
    updateUndoButtonState();
  }

  function updateUndoButtonState() {
    const undoBtn = document.getElementById('btn-undo');
    undoBtn.disabled = (stateHistory.length === 0 || currentTurn !== 'player');
  }

  // 初始化牌堆 (加入了装备牌与新锦囊)
  function initDeck() {
    deck = [];
    discardPile = [];
    const composition = [
      { type: 'STRIKE', count: 14 },
      { type: 'DODGE', count: 10 },
      { type: 'HEAL', count: 5 },
      { type: 'DRAW2', count: 4 },
      { type: 'DISCARD', count: 4 },
      { type: 'DUEL', count: 3 },
      { type: 'STEAL', count: 3 },
      { type: 'EQ_WEAPON1', count: 2 },
      { type: 'EQ_WEAPON2', count: 2 },
      { type: 'EQ_ARMOR1', count: 2 },
      { type: 'EQ_ARMOR2', count: 2 },
      { type: 'EQ_TREASURE1', count: 2 },
      { type: 'EQ_TREASURE2', count: 2 }
    ];

    composition.forEach(item => {
      for(let i = 0; i < item.count; i++) {
        deck.push(item.type);
      }
    });

    // 洗牌
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    updateDeckUI();
  }

  // 摸牌逻辑
  function drawCards(target, count) {
    let drawn = [];
    for(let i = 0; i < count; i++) {
      if(deck.length === 0) {
        if(discardPile.length === 0) {
          addLog("⚠️ 牌堆与弃牌堆已全空！", "system");
          break;
        }
        deck = [...discardPile].sort(() => Math.random() - 0.5);
        discardPile = [];
        addLog("🔄 牌堆已用尽，将弃牌堆重新洗牌！", "system");
      }
      const card = deck.pop();
      target.hand.push(card);
      drawn.push(card);
    }
    soundEngine.playWhoosh();
    updateDeckUI();
    renderAllUI();
    return drawn;
  }

  function updateDeckUI() {
    document.getElementById('deck-count').textContent = deck.length;
    document.getElementById('discard-count').textContent = discardPile.length;
  }

    let styleClasses = "py-0.5 px-1 rounded transition-all ";
    if(type === 'player') styleClasses += "bg-sky-950/50 text-sky-200 border-l-2 border-sky-400";
    else if(type === 'ai') styleClasses += "bg-amber-950/50 text-amber-200 border-l-2 border-amber-400";
    else if(type === 'skill') styleClasses += "bg-purple-950/60 text-purple-200 font-bold border-l-2 border-purple-400";
    else if(type === 'equip') styleClasses += "bg-amber-950/40 text-amber-300 font-bold border-l-2 border-amber-500";
    else styleClasses += "text-slate-400 italic";

    item.className = styleClasses;
    item.innerHTML = text;
    logBox.appendChild(item);
    logBox.scrollTop = logBox.scrollHeight;
  }

  // 回合切换 Banner
  function showTurnBanner(text) {
    const banner = document.getElementById('turn-banner');
    const bannerText = document.getElementById('turn-banner-text');
    bannerText.textContent = text;
    banner.classList.remove('hidden', 'animate-banner');
    void banner.offsetWidth; // 触发重绘
    banner.classList.add('animate-banner');
    setTimeout(() => {
      banner.classList.add('hidden');
    }, 1300);
  }

  // 浮动伤害/治疗数值
  function showFloatingFX(targetWho, text, isHeal = false) {
    const targetEl = targetWho === 'player' ? document.getElementById('player-avatar-box') : document.getElementById('ai-avatar-box');
    if (!targetEl) return;

    const floatEl = document.createElement('div');
    floatEl.className = `floating-num ${isHeal ? 'text-emerald-400' : 'text-rose-500'}`;
    floatEl.textContent = text;
    floatEl.style.left = '20%';
    floatEl.style.top = '-10px';

    targetEl.appendChild(floatEl);
    setTimeout(() => floatEl.remove(), 1100);
  }

  // ==========================================
  // 伤害计算管道与防具/技能被动响应
  // ==========================================
  function applyDamageToPlayer(rawAmount, isSkillDamage = false) {
    let amount = rawAmount;

    // 玩家技能【减压】：装备槽满或装备防具时，受到的技能伤害-1
    if (isSkillDamage) {
      const isEquipFull = player.equip.weapon && player.equip.armor && player.equip.treasure;
      if (isEquipFull || player.equip.armor) {
        amount = Math.max(0, amount - 1);
        addLog("🛡️ 触发被动【减压】：装备防御就绪，受到的技能压制伤害-1！", "player");
      }
    }

    if (amount <= 0) return;

    // 装备防具【头戴耳机】：每轮首次受伤/技能自动抵消1点
    if (player.equip.armor === 'EQ_ARMOR1' && !player.headphonesUsedThisRound) {
      player.headphonesUsedThisRound = true;
      amount--;
      soundEngine.playShield();
      addLog("🎧 【头戴耳机】防线防护生效！阻挡了 1 点伤害/攻击！", "equip");

      const avatarBox = document.getElementById('player-avatar');
      avatarBox.classList.add('headphone-active');
      setTimeout(() => avatarBox.classList.remove('headphone-active'), 800);

      if (amount <= 0) {
        renderAllUI();
        return;
      }
    }

    // 装备防具【重型羽绒服】：50%概率完全免疫伤害
    if (player.equip.armor === 'EQ_ARMOR2' && Math.random() < 0.5) {
      soundEngine.playShield();
      addLog("🧥 穿戴【重型羽绒服】完美御寒保暖！成功免疫了本次伤害！", "equip");
      renderAllUI();
      return;
    }

    player.hp = Math.max(0, player.hp - amount);
    soundEngine.playDamage();
    showFloatingFX('player', `-${amount}`, false);

    const appEl = document.getElementById('game-app');
    appEl.classList.add('animate-shake');
    setTimeout(() => appEl.classList.remove('animate-shake'), 400);

    // 妈妈被动【内卷提速】：造成伤害时摸1张牌
    if (ai.role && ai.role.id === 'mom') {
      addLog("⚡ 妈妈触发被动【内卷提速】：造成伤害受到鼓舞，摸 1 张牌！", "ai");
      drawCards(ai, 1);
    }

    renderAllUI();
    checkBattleEnd();
  }

  function applyDamageToAI(rawAmount, isStrike = false) {
    let amount = rawAmount;

    // 外公被动【大腹便便】：体力≤2时受到伤害-1
    if (ai.role && ai.role.id === 'grandpa_m' && ai.hp <= 2) {
      amount = Math.max(0, amount - 1);
      addLog("🥩 外公触发被动【大腹便便】：体胖肉厚，受到伤害 -1！", "ai");
    }

    if (amount <= 0) return;

    // 护盾抵扣
    let damageLeft = amount;
    if (ai.armor > 0) {
      if (ai.armor >= damageLeft) {
        ai.armor -= damageLeft;
        damageLeft = 0;
        addLog(`🛡️ ${ai.role.name} 的护盾抵挡了所有伤害！`, "system");
      } else {
        damageLeft -= ai.armor;
        ai.armor = 0;
        addLog(`🛡️ ${ai.role.name} 的护盾被击碎！`, "system");
      }
    }

    if (damageLeft > 0) {
      ai.hp = Math.max(0, ai.hp - damageLeft);
      soundEngine.playDamage();
      showFloatingFX('ai', `-${damageLeft}`, false);

      // 玩家武器【游戏手柄】：【表达主见】命中时额外摸1张牌
      if (isStrike && player.equip.weapon === 'EQ_WEAPON1') {
        soundEngine.playSkill();
        addLog("🎮 装备【游戏手柄】命中敌人，打出连招打法，额外摸 1 张牌！", "equip");
        drawCards(player, 1);
      }

      // 奶奶被动【道德绑架】：受到【表达主见】伤害时，玩家需弃置1张手牌
      if (isStrike && ai.role && ai.role.id === 'grandma_p' && player.hand.length > 0) {
        player.hand.pop();
        addLog("👵🏻 奶奶触发被动【道德绑架】：受到了训斥发难，迫使少年弃置了 1 张手牌！", "ai");
      }
    }

    renderAllUI();
    checkBattleEnd();
  }

  // 主动技能【叛逆】
  function useRebelSkill() {
    if(currentTurn !== 'player') return;
    if(player.rebelUsedThisTurn) {
      addLog("⚠️ 本回合你已经发动过【叛逆】技能了！", "system");
      return;
    }

    const dodgeIdx = player.hand.indexOf('DODGE');
    const buttons = [];

    // 选项1：弃置1张牌造1伤
    if (player.hand.length > 0) {
      buttons.push({
        text: '💥 弃1张牌造成1点反击伤害',
        class: 'bg-red-800 hover:bg-red-700 text-white text-xs py-2',
        onClick: () => {
          showPromptModal({
            icon: '⚡',
            title: '选择弃置的牌',
            desc: '选择 1 张手牌弃置：',
            buttons: player.hand.map((cardKey, index) => ({
              text: CARD_DATABASE[cardKey].name,
              class: 'bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs py-1.5',
              onClick: () => {
                saveStateSnapshot();
                player.hand.splice(index, 1);
                player.rebelUsedThisTurn = true;
                soundEngine.playSkill();
                addLog("⚡ 少年发动【叛逆】，弃牌强力反击，长辈深受震撼！", "player");
                applyDamageToAI(1, false);
                closePromptModal();
                renderAllUI();
              }
            }))
          });
        }
      });
    }

    // 选项2：将【巧妙化解】当作【表达主见】打出
    if (dodgeIdx !== -1) {
      buttons.push({
        text: '🗣️ 将【巧妙化解】(闪) 当作【表达主见】(杀) 打出',
        class: 'bg-amber-700 hover:bg-amber-600 text-white text-xs py-2',
        onClick: () => {
          saveStateSnapshot();
          player.hand.splice(dodgeIdx, 1);
          player.rebelUsedThisTurn = true;
          soundEngine.playAttack();
          addLog("⚡ 少年发动【叛逆】：化守为攻，将【巧妙化解】当作【表达主见】打出！", "player");
          closePromptModal();
          executePlayerStrikeLogic();
        }
      });
    }

    buttons.push({
      text: '取消',
      class: 'bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs py-1.5',
      onClick: () => closePromptModal()
    });

    showPromptModal({
      icon: '⚡',
      title: '发动主动技能【叛逆】',
      desc: '每回合限一次，请选择叛逆反抗方式：',
      buttons: buttons
    });
  }

  // 执行【表达主见】结算逻辑 (考量错题集等武器)
  function executePlayerStrikeLogic() {
    let requiredDodges = 1;
    // 武器【错题集】：对方需要2张【巧妙化解】
    if (player.equip.weapon === 'EQ_WEAPON2') {
      requiredDodges = 2;
      addLog("📖 装备【错题集】压制：对方必须打出 2 张【巧妙化解】才能抵消！", "equip");
    }

    let aiDodgeCount = 0;
    for (let i = ai.hand.length - 1; i >= 0; i--) {
      if (ai.hand[i] === 'DODGE') {
        ai.hand.splice(i, 1);
        discardPile.push('DODGE');
        aiDodgeCount++;
        if (aiDodgeCount >= requiredDodges) break;
      }
    }

    if (aiDodgeCount >= requiredDodges) {
      soundEngine.playShield();
      addLog(`👵/👴/👨 ${ai.role.name} 打出了 ${aiDodgeCount} 张【巧妙化解】，化解了你的主见！`, "ai");
    } else {
      addLog(`💥 ${ai.role.name} 未能完全化解，受到 1 点表达主见伤害！`, "player");
      applyDamageToAI(1, true);
    }
    renderAllUI();
  }

  // 玩家打出手牌
  function playCardFromHand(index) {
    if(currentTurn !== 'player') return;

    if(index === player.lockedCardIndex) {
      addLog("🔒 该卡牌正被爷爷的【营销号洗脑】封锁中，本回合无法打出！", "system");
      return;
    }

    const cardKey = player.hand[index];
    const cardData = CARD_DATABASE[cardKey];

    if(cardData.type === 'BASIC' && cardKey === 'DODGE') {
      addLog("🛡️ 【巧妙化解】是防御牌，只能在响应说教时使用（或通过【叛逆】技能转化为杀）。", "system");
      return;
    }

    if(cardKey === 'HEAL' && player.healBlocked) {
      addLog("🧥 受到外婆【有一种冷】影响被套了厚秋裤，本回合无法使用【喘息复原】！", "system");
      return;
    }

    saveStateSnapshot(); // 记录撤销点

    // 穿戴装备牌
    if(cardData.type === 'EQUIP') {
      player.hand.splice(index, 1);
      const slot = cardData.slot;
      if(player.equip[slot]) {
        discardPile.push(player.equip[slot]); // 替换旧装备放入弃牌堆
      }
      player.equip[slot] = cardKey;
      soundEngine.playEquip();
      addLog(`🛡️ 少年穿戴了【${cardData.name}】(${cardData.tag})！`, "equip");
      animateCardPlay(cardData);
      renderAllUI();
      return;
    }

    // 基础牌 / 锦囊牌
    player.hand.splice(index, 1);
    discardPile.push(cardKey);
    animateCardPlay(cardData);

    addLog(`👦 少年打出了【${cardData.name}】！`, "player");

    if(cardKey === 'STRIKE') {
      soundEngine.playAttack();
      executePlayerStrikeLogic();
    } else if(cardKey === 'HEAL') {
      soundEngine.playHeal();
      if(player.hp < player.maxHp) {
        player.hp++;
        showFloatingFX('player', '+1', true);
        addLog("🏸 少年适度羽毛球/吃零食恢复，恢复了 1 点体力！", "player");
      } else {
        addLog("🥤 体力已满，少年喝了口水放松心情。", "player");
      }
    } else if(cardKey === 'DRAW2') {
      soundEngine.playSkill();
      addLog("💡 少年打出【独立思考】，理清思维逻辑，额外摸 2 张牌！", "player");
      drawCards(player, 2);
    } else if(cardKey === 'DISCARD') {
      soundEngine.playSkill();
      // 爷爷被动【固步自封】：免疫【划清界限】
      if(ai.role.id === 'grandpa_p') {
        addLog("👴🏻 爷爷触发被动【固步自封】：油盐不进，免疫少年的【划清界限】！", "ai");
      } else {
        if(ai.hand.length > 0) {
          const randIdx = Math.floor(Math.random() * ai.hand.length);
          ai.hand.splice(randIdx, 1);
          addLog(`✂️ 少年打出【划清界限】，弃置了 ${ai.role.name} 的 1 张手牌！`, "player");
        } else {
          addLog(`✂️ ${ai.role.name} 已经没有任何手牌可被弃置了。`, "system");
        }
      }
    } else if(cardKey === 'STEAL') {
      soundEngine.playSkill();
      // 爸爸被动【固执己见】：装备不可被夺走，但可拿手牌
      let stolen = false;
      if(ai.role.id === 'dad') {
        addLog("👨 爸爸触发被动【固执己见】：装备权威不可动摇！只能对其手牌尝试顺走。", "ai");
      }
      if(ai.hand.length > 0) {
        const randIdx = Math.floor(Math.random() * ai.hand.length);
        const card = ai.hand.splice(randIdx, 1)[0];
        player.hand.push(card);
        stolen = true;
        addLog(`🎯 少年打出【借题发挥】，从 ${ai.role.name} 手中顺走了 1 张卡牌！`, "player");
      }
      if(!stolen) {
        addLog(`🎯 ${ai.role.name} 没有任何可被借题发挥顺走的牌。`, "system");
      }
    } else if(cardKey === 'DUEL') {
      soundEngine.playSkill();
      addLog(`⚖️ 少年发起了【据理力争】，与 ${ai.role.name} 展开逻辑大辩论！`, "player");
      resolveDuelPhase('ai');
    }

    renderAllUI();
    checkBattleEnd();
  }

  // 中央打牌飞入动画
  function animateCardPlay(cardData) {
    const cardBox = document.getElementById('last-card-box');
    cardBox.innerHTML = `
      <div id="last-card-display" class="card-played-active text-xs md:text-sm font-black text-amber-300 py-1.5 px-4 bg-amber-500/20 border border-amber-500/50 rounded-xl shadow-2xl">
        ${cardData.icon} ${cardData.name} (${cardData.tag})
      </div>
    `;
  }

  // 据理力争 决斗结算
  function resolveDuelPhase(nextTurnWho) {
    if(nextTurnWho === 'ai') {
      const strikeIdx = ai.hand.indexOf('STRIKE');
      if(strikeIdx !== -1) {
        ai.hand.splice(strikeIdx, 1);
        discardPile.push('STRIKE');
        soundEngine.playAttack();
        addLog(`💬 ${ai.role.name} 打出【表达主见】，据理力争！`, "ai");
        setTimeout(() => resolveDuelPhase('player'), 600);
      } else {
        addLog(`💥 ${ai.role.name} 在逻辑辩论中语塞，受到 1 点伤害！`, "player");
        applyDamageToAI(1, false);
      }
    } else {
      const strikeIdx = player.hand.indexOf('STRIKE');
      if(strikeIdx !== -1) {
        showPromptModal({
          icon: '⚖️',
          title: '据理力争辩论中',
          desc: '对方打出了【表达主见】，是否打出【表达主见】进行反驳？',
          buttons: [
            {
              text: '打出【表达主见】',
              class: 'bg-red-600 hover:bg-red-500 text-white font-bold text-xs py-2',
              onClick: () => {
                player.hand.splice(strikeIdx, 1);
                discardPile.push('STRIKE');
                soundEngine.playAttack();
                addLog('💬 少年打出【表达主见】，强力反驳！', 'player');
                closePromptModal();
                setTimeout(() => resolveDuelPhase('ai'), 600);
              }
            },
            {
              text: '放弃辩论 (受1伤)',
              class: 'bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs py-2',
              onClick: () => {
                addLog('💥 少年放弃辩论，受到 1 点压制伤害！', 'ai');
                applyDamageToPlayer(1, false);
                closePromptModal();
              }
            }
          ]
        });
      } else {
        addLog('💥 少年手中没有【表达主见】，辩论落败受到 1 点伤害！', 'ai');
        applyDamageToPlayer(1, false);
      }
    }
  }

  // 开始玩家回合
  function startPlayerTurn() {
    currentTurn = 'player';
    player.rebelUsedThisTurn = false;
    player.healBlocked = false;
    player.lockedCardIndex = -1;
    player.headphonesUsedThisRound = false;
    ai.headphonesUsedThisRound = false;
    stateHistory = []; // 清空上轮撤销栈

    showTurnBanner('👦 你的回合开始！');
    addLog("=== 👦 你的回合开始 ===", "system");

    // 装备宝物【压岁钱存折】：摸牌阶段多摸1张
    let drawCount = 2;
    if (player.equip.treasure === 'EQ_TREASURE1') {
      drawCount = 3;
      addLog("🧧 装备【压岁钱存折】生效：经济独立，摸牌阶段多摸 1 张牌！", "equip");
    }
    drawCards(player, drawCount);

    renderAllUI();
    updateUndoButtonState();
  }

  // 结束玩家回合
  function endPlayerTurn() {
    if(currentTurn !== 'player') return;

    // 装备宝物【筋膜理疗仪】：若手牌小于上限，50%概率恢复1点体力
    const maxHand = player.hp + 1; // 少年锁定技【自主】：手牌上限 = 当前体力 + 1
    if (player.equip.treasure === 'EQ_TREASURE2' && player.hand.length < maxHand && player.hp < player.maxHp) {
      if (Math.random() < 0.5) {
        player.hp++;
        showFloatingFX('player', '+1', true);
        soundEngine.playHeal();
        addLog("⚡ 装备【筋膜理疗仪】按摩复原：触发疗愈，恢复 1 点体力！", "equip");
      }
    }

    // 弃牌阶段：手牌上限 = 当前体力值 + 1
    if(player.hand.length > maxHand) {
      const needDiscard = player.hand.length - maxHand;
      addLog(`📦 触发锁定技【自主】（手牌上限=当前体力+1=${maxHand}），弃置 ${needDiscard} 张多余手牌。`, "system");
      for(let i = 0; i < needDiscard; i++) {
        const drop = player.hand.pop();
        discardPile.push(drop);
      }
    }

    renderAllUI();
    currentTurn = 'ai';
    showTurnBanner(`👵/👴/👨 ${ai.role.name} 的回合！`);
    setTimeout(executeAITurn, 1200);
  }

  // ==========================================
  // 执行 AI 回合与长辈特色双技能
  // ==========================================
  function executeAITurn() {
    addLog(`=== 👵/👴/👨 ${ai.role.name} 的回合开始 ===`, "system");

    // 长辈摸牌
    let drawCount = 2;
    if (ai.equip.treasure === 'EQ_TREASURE1') drawCount = 3;
    drawCards(ai, drawCount);

    // AI 触发专属技能与逻辑
    executeElderSkills();

    // AI 出牌阶段
    setTimeout(() => {
      aiPlayPhase();
    }, 1000);
  }

  function executeElderSkills() {
    const rId = ai.role.id;

    // 1. 妈妈：海量报班 (主动)
    if(rId === 'mom') {
      soundEngine.playSkill();
      addLog(`📚 妈妈甩出5套卷子与奥数班通知：发动【海量报班】！`, "skill");
      const dodgeIdx = player.hand.indexOf('DODGE');
      if(dodgeIdx !== -1) {
        showPromptModal({
          icon: '📚',
          title: '海量报班轰炸！',
          desc: '妈妈逼你立刻去上奥数培训班！请选择应对方案：',
          buttons: [
            {
              text: '打出【巧妙化解】',
              class: 'bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs py-2',
              onClick: () => {
                player.hand.splice(dodgeIdx, 1);
                discardPile.push('DODGE');
                soundEngine.playShield();
                addLog('🛡️ 少年打出【巧妙化解】，顶住了报班压力！', 'player');
                closePromptModal();
              }
            },
            {
              text: '弃置 2 张手牌',
              class: 'bg-amber-700 hover:bg-amber-600 text-white font-bold text-xs py-2',
              onClick: () => {
                for(let k=0; k<2; k++) { if(player.hand.length > 0) player.hand.pop(); }
                addLog('📚 少年被迫弃置了 2 张手牌妥协...', 'ai');
                closePromptModal();
              }
            },
            {
              text: '承受压制 (受1伤害)',
              class: 'bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs py-2',
              onClick: () => {
                addLog('💥 少年承受不住报班压迫感，受到 1 点技能伤害！', 'ai');
                applyDamageToPlayer(1, true);
                closePromptModal();
              }
            }
          ]
        });
      } else {
        addLog('💥 少年没有【巧妙化解】，受到 1 点技能压制伤害并被迫弃牌！', 'ai');
        if(player.hand.length > 0) player.hand.pop();
        applyDamageToPlayer(1, true);
      }
    }
    // 2. 外婆：有一种冷 (主动)
    else if(rId === 'grandma_m') {
      soundEngine.playSkill();
      addLog(`🧥 外婆强行拿羽绒服秋裤套你：发动【有一种冷】！`, "skill");
      player.healBlocked = true;
      if(player.hand.length > 0) player.hand.pop();
      addLog('🧥 少年被套上了厚秋裤！下回合无法使用【喘息复原】，且被弃置1张手牌！', 'ai');
    }
    // 3. 外公：过度消毒 (主动)
    else if(rId === 'grandpa_m') {
      soundEngine.playSkill();
      addLog(`🧴 外公拿酒精喷雾全屋喷洒：‘外面全是细菌！’发动【过度消毒】！`, "skill");
      let destroyed = false;
      // 优先破坏玩家的防具或武器
      if(player.equip.armor) {
        discardPile.push(player.equip.armor);
        player.equip.armor = null;
        destroyed = true;
        addLog('🧴 外公全屋狂喷酒精，摧毁了少年的防具！', 'ai');
      } else if(player.equip.weapon) {
        discardPile.push(player.equip.weapon);
        player.equip.weapon = null;
        destroyed = true;
        addLog('🧴 外公全屋狂喷酒精，摧毁了少年的武器！', 'ai');
      } else if(player.hand.length > 0) {
        player.hand.pop();
        destroyed = true;
        addLog('🧴 外公强行酒精喷洒消毒，摧毁了少年 1 张手牌！', 'ai');
      }
    }
    // 4. 爷爷：营销号洗脑 (主动)
    else if(rId === 'grandpa_p') {
      soundEngine.playSkill();
      addLog(`📱 爷爷在家族群转发短视频营销号文章：发动【营销号洗脑】！`, "skill");
      if(player.hand.length > 0) {
        const stolenCard = player.hand.pop();
        ai.hand.push(stolenCard);
        if(ai.hand.length > 1) {
          const giveCard = ai.hand.shift();
          player.hand.push(giveCard);
          addLog('📱 爷爷强行抽取少年的 1 张手牌，并交换给了少年 1 张牌！', 'ai');
        }
      }
    }
    // 5. 奶奶：碎碎念 (主动)
    else if(rId === 'grandma_p') {
      soundEngine.playSkill();
      addLog(`👵🏻 奶奶开启碎碎念模式：‘我吃的盐比你吃的米还多！’发动【碎碎念】！`, "skill");
      if(player.hand.length > 0) {
        showPromptModal({
          icon: '👵🏻',
          title: '奶奶开启碎碎念模式！',
          desc: '‘我吃过的盐比你吃过的米还多！’请做出回应方案：',
          buttons: [
            {
              text: '忍痛弃置 1 张手牌',
              class: 'bg-amber-700 hover:bg-amber-600 text-white font-bold text-xs py-2',
              onClick: () => {
                player.hand.pop();
                addLog('🤯 少年忍受不了唠叨，弃置了 1 张手牌。', 'player');
                closePromptModal();
              }
            },
            {
              text: '让奶奶多摸 1 张牌',
              class: 'bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs py-2',
              onClick: () => {
                drawCards(ai, 1);
                addLog('👵🏻 奶奶得到了回应，心情愉悦额外摸了 1 张牌。', 'ai');
                closePromptModal();
              }
            }
          ]
        });
      } else {
        drawCards(ai, 1);
        addLog('👵🏻 少年无牌可弃，奶奶碎碎念后额外摸了 1 张牌。', 'ai');
      }
    }
    // 6. 爸爸：威严压制 (主动)
    else if(rId === 'dad') {
      soundEngine.playSkill();
      addLog(`👨 爸爸拍桌子拉长脸：‘我是你老子！’发动【威严压制】！`, "skill");
      if(ai.hand.length > player.hand.length) {
        addLog('👨 爸爸手牌数量多于少年，权威压制成功！强制造成 1 点技能伤害！', 'ai');
        applyDamageToPlayer(1, true);
      } else {
        addLog('👦 少年手牌充沛底气十足，顶住了爸爸的权威压制！', 'player');
      }
    }

    renderAllUI();
  }

  // AI 出牌引擎
  function aiPlayPhase() {
    if(ai.hp <= 0) return;

    let played = true;
    let guardCounter = 0;

    while(played && guardCounter < 4) {
      guardCounter++;
      played = false;

      // 穿戴装备
      for (let i = ai.hand.length - 1; i >= 0; i--) {
        const cKey = ai.hand[i];
        if (CARD_DATABASE[cKey].type === 'EQUIP') {
          const slot = CARD_DATABASE[cKey].slot;
          if (!ai.equip[slot]) {
            ai.hand.splice(i, 1);
            ai.equip[slot] = cKey;
            soundEngine.playEquip();
            addLog(`👵/👴/👨 ${ai.role.name} 穿戴了装备【${CARD_DATABASE[cKey].name}】！`, "equip");
            played = true;
            break;
          }
        }
      }

      // 回血牌
      const healIdx = ai.hand.indexOf('HEAL');
      if(healIdx !== -1 && ai.hp < ai.maxHp) {
        ai.hand.splice(healIdx, 1);
        // 外婆被动【偏方大补】：回血过满转护盾
        if(ai.role.id === 'grandma_m' && ai.hp >= ai.maxHp) {
          ai.armor++;
          addLog("👵 外婆触发被动【偏方大补】：喝大补汤血量溢出，转化为 1 层护盾！", "ai");
        } else {
          ai.hp++;
          showFloatingFX('ai', '+1', true);
          soundEngine.playHeal();
          addLog(`👵/👴/👨 ${ai.role.name} 打出【喘息复原】，恢复了 1 点体力！`, "ai");
        }
        played = true;
        continue;
      }

      // 表达主见 (杀)
      const strikeIdx = ai.hand.indexOf('STRIKE');
      if(strikeIdx !== -1) {
        ai.hand.splice(strikeIdx, 1);
        discardPile.push('STRIKE');
        soundEngine.playAttack();
        addLog(`🗣️ ${ai.role.name} 打出【表达主见】展开严厉训斥！`, "ai");

        const dodgeIdx = player.hand.indexOf('DODGE');
        if(dodgeIdx !== -1) {
          player.hand.splice(dodgeIdx, 1);
          discardPile.push('DODGE');
          soundEngine.playShield();
          addLog("🛡️ 少年迅速打出【巧妙化解】，化解了训斥！", "player");
        } else {
          addLog("💥 少年未能化解，受到了 1 点压制伤害！", "ai");
          applyDamageToPlayer(1, false);
        }
        played = true;
        continue;
      }

      // 摸牌锦囊
      const draw2Idx = ai.hand.indexOf('DRAW2');
      if(draw2Idx !== -1) {
        ai.hand.splice(draw2Idx, 1);
        drawCards(ai, 2);
        addLog(`💡 ${ai.role.name} 打出【独立思考】（总结管教经验），额外摸了2张牌！`, "ai");
        played = true;
        continue;
      }
    }

    // AI 弃牌阶段 (外公被动【大腹便便】手牌上限+1)
    let maxAiHand = ai.hp;
    if(ai.role.id === 'grandpa_m') maxAiHand += 1;

    while(ai.hand.length > maxAiHand) {
      ai.hand.pop();
    }

    renderAllUI();

    if(!checkBattleEnd()) {
      setTimeout(startPlayerTurn, 1000);
    }
  }

  // ==========================================
  // UI 渲染与状态更新
  // ==========================================
  function renderAllUI() {
    renderHpIcons('player-hp-container', player.hp, player.maxHp);
    renderHpIcons('ai-hp-container', ai.hp, ai.maxHp);

    // 护盾与手牌数
    const armorBadge = document.getElementById('ai-armor-badge');
    if(ai.armor > 0) {
      armorBadge.classList.remove('hidden');
      document.getElementById('ai-armor-val').textContent = ai.armor;
    } else {
      armorBadge.classList.add('hidden');
    }

    document.getElementById('ai-card-count').textContent = ai.hand.length;

    // 渲染装备槽
    renderEquipments('player-eq', player.equip);
    renderEquipments('ai-eq', ai.equip);

    // 负面状态提示
    document.getElementById('debuff-tag-cold').style.display = player.healBlocked ? 'inline-block' : 'none';
    document.getElementById('debuff-tag-lock').style.display = (player.lockedCardIndex !== -1) ? 'inline-block' : 'none';

    document.getElementById('btn-rebel').disabled = (currentTurn !== 'player' || player.rebelUsedThisTurn || player.hand.length === 0);
    document.getElementById('btn-end-turn').disabled = (currentTurn !== 'player');
    updateUndoButtonState();

    // 渲染玩家手牌
    const handBox = document.getElementById('player-hand');
    handBox.innerHTML = '';

    player.hand.forEach((cardKey, index) => {
      const card = CARD_DATABASE[cardKey];
      const cardEl = document.createElement('div');
      const isLocked = (index === player.lockedCardIndex);

      cardEl.className = `card-item cursor-pointer flex-shrink-0 w-24 md:w-28 h-32 md:h-36 rounded-2xl p-2 bg-gradient-to-b ${card.color} border shadow-lg flex flex-col justify-between select-none relative overflow-hidden ${isLocked ? 'opacity-40 grayscale border-purple-500' : ''}`;
      cardEl.onclick = () => playCardFromHand(index);

      cardEl.innerHTML = `
        <div class="flex justify-between items-center">
          <span class="text-xs md:text-sm">${card.icon}</span>
          <span class="text-[8px] px-1.5 py-0.5 rounded-full ${card.badge} font-bold">${card.tag}</span>
        </div>
        <div class="text-center font-black text-xs my-0.5">${card.name}</div>
        <div class="text-[8px] md:text-[9px] text-slate-300 leading-tight text-center line-clamp-3">${card.desc}</div>
        <div class="text-[7px] text-slate-500 text-right mt-0.5 font-mono">13岁逆袭</div>
      `;
      handBox.appendChild(cardEl);
    });
  }

  function renderEquipments(prefix, equipObj) {
    const slots = ['weapon', 'armor', 'treasure'];
    const names = { weapon: '武器', armor: '防具', treasure: '宝物' };
    const icons = { weapon: '⚔️', armor: '🛡️', treasure: '🏺' };

    slots.forEach(slot => {
      const el = document.getElementById(`${prefix}-${slot}`);
      if (!el) return;
      const cardKey = equipObj[slot];
      if (cardKey) {
        const card = CARD_DATABASE[cardKey];
        el.className = 'equip-slot filled rounded-xl px-2 py-1 text-[10px] flex items-center gap-1 text-amber-300 min-w-[90px] font-bold cursor-pointer';
        el.innerHTML = `<span>${card.icon}</span><span class="slot-name">${card.name}</span>`;
      } else {
        el.className = 'equip-slot rounded-xl px-2 py-1 text-[10px] flex items-center gap-1 text-slate-500 min-w-[90px]';
        el.innerHTML = `<span>${icons[slot]}</span><span class="slot-name">无${names[slot]}</span>`;
      }
    });
  }

  function renderHpIcons(containerId, current, max) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    for(let i = 0; i < max; i++) {
      const heart = document.createElement('span');
      heart.className = "text-xs md:text-sm transition-all";
      heart.textContent = i < current ? "❤️" : "🖤";
      container.appendChild(heart);
    }
  }

  // 弹窗管理
  function showPromptModal({ icon, title, desc, buttons }) {
    document.getElementById('prompt-icon').textContent = icon;
    document.getElementById('prompt-title').textContent = title;
    document.getElementById('prompt-desc').textContent = desc;

    const btnContainer = document.getElementById('prompt-buttons');
    btnContainer.innerHTML = '';

    buttons.forEach(b => {
      const button = document.createElement('button');
      button.className = `w-full py-2 rounded-xl font-bold transition shadow ${b.class}`;
      button.textContent = b.text;
      button.onclick = b.onClick;
      btnContainer.appendChild(button);
    });

    document.getElementById('prompt-modal-overlay').classList.remove('hidden');
  }

  function closePromptModal() {
    document.getElementById('prompt-modal-overlay').classList.add('hidden');
  }

  function checkBattleEnd() {
    if(player.hp <= 0) {
      soundEngine.playDefeat();
      showEndGameModal({
        win: false,
        icon: '💔',
        title: '少年被彻底压制了...',
        message: `在 ${ai.role.name} 的高压与说教下，你的自主意识被迫妥协...\n戴紧【头戴耳机】，重新发起对决，赢回属于你的独立空间！`
      });
      return true;
    } else if(ai.hp <= 0) {
      soundEngine.playVictory();
      showEndGameModal({
        win: true,
        icon: '🏆',
        title: '逆袭成功！家庭阵地大胜利！',
        message: `你凭借【独立思考】与【据理力争】，成功让 ${ai.role.name} 尊重了初一少年的独立自主权！家庭关系获得了全新的平等平衡！`
      });
      return true;
    }
    return false;
  }

  function showEndGameModal({ win, icon, title, message }) {
    document.getElementById('end-icon').textContent = icon;
    document.getElementById('end-title').textContent = title;
    document.getElementById('end-title').className = win ? "text-xl font-black text-emerald-400 mb-2" : "text-xl font-black text-rose-400 mb-2";
    document.getElementById('end-message').textContent = message;
    document.getElementById('end-modal-overlay').classList.remove('hidden');
  }

  function openIntroModal(role) {
    document.getElementById('intro-avatar').textContent = role.avatar;
    document.getElementById('intro-name').textContent = role.name;
    document.getElementById('intro-badge').textContent = role.title;
    document.getElementById('intro-quote').textContent = role.quote;

    const skillsBox = document.getElementById('intro-skills');
    skillsBox.innerHTML = '';
    role.skills.forEach(s => {
      const div = document.createElement('div');
      div.innerHTML = `<span class="font-bold text-amber-300">【${s.name}】</span>: ${s.desc}`;
      skillsBox.appendChild(div);
    });

    document.getElementById('intro-modal-overlay').classList.remove('hidden');
  }

  function closeIntroModal() {
    soundEngine.init();
    document.getElementById('intro-modal-overlay').classList.add('hidden');
  }

  function restartGame() {
    document.getElementById('end-modal-overlay').classList.add('hidden');
    document.getElementById('battle-log').innerHTML = '';

    // 随机抽取一位长辈
    const selectedRole = AI_ROLES[Math.floor(Math.random() * AI_ROLES.length)];
    ai.role = selectedRole;
    ai.hp = selectedRole.maxHp;
    ai.maxHp = selectedRole.maxHp;
    ai.armor = 0;
    ai.hand = [];
    ai.equip = { weapon: null, armor: null, treasure: null };

    player.hp = 4;
    player.maxHp = 4;
    player.hand = [];
    player.equip = { weapon: null, armor: null, treasure: null };
    player.rebelUsedThisTurn = false;
    player.headphonesUsedThisRound = false;
    player.healBlocked = false;
    player.lockedCardIndex = -1;
    stateHistory = [];

    document.getElementById('ai-name').textContent = selectedRole.name;
    document.getElementById('ai-avatar').textContent = selectedRole.avatar;
    document.getElementById('ai-title-badge').textContent = selectedRole.title;
    document.getElementById('ai-quote').textContent = selectedRole.quote;

    initDeck();

    addLog(`🎮 家庭卡牌对决开启！你的对手是【${selectedRole.name}】（${selectedRole.title}）。`, "system");
    addLog(`📢 ${selectedRole.name} 喊话：${selectedRole.quote}`, "ai");

    drawCards(player, 4);
    drawCards(ai, 4);

    openIntroModal(selectedRole);
    startPlayerTurn();
  }

  window.onload = () => {
    restartGame();
  };
</script>
