<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国杀 1v1 经典沉浸版</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wei: '#1e3a8a',
                        shu: '#991b1b',
                        wu: '#065f46',
                        qun: '#581c87',
                        parchment: '#f4e8c1',
                        darkwood: '#1a100c',
                        ancientgold: '#d4af37',
                        crimson: '#8b0000',
                    },
                    boxShadow: {
                        'ancient': '0 0 15px rgba(212, 175, 55, 0.3)',
                        'card': '0 8px 16px rgba(0,0,0,0.6)',
                        'glow-red': '0 0 20px rgba(239, 68, 68, 0.8)',
                        'glow-green': '0 0 20px rgba(34, 197, 94, 0.8)',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@600;900&display=swap');

        body {
            font-family: 'Noto Serif SC', serif;
            background: radial-gradient(circle at center, #2c1d11 0%, #120a06 100%);
            color: #f3e5ab;
            user-select: none;
            overflow-x: hidden;
        }

        .font-calligraphy {
            font-family: 'Ma Shan Zheng', cursive;
        }

        /* Chinese Wood & Gold Border Styling */
        .wood-panel {
            background: linear-gradient(135deg, rgba(45,26,16,0.95) 0%, rgba(20,11,6,0.98) 100%);
            border: 2px solid #8c6d3f;
            box-shadow: inset 0 0 10px #000, 0 4px 12px rgba(0,0,0,0.8);
            position: relative;
        }

        .wood-panel::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            pointer-events: none;
        }

        .card {
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
            background: linear-gradient(180deg, #fceabb 0%, #f8b500 100%);
        }

        .card:hover {
            transform: translateY(-24px) scale(1.08);
            z-index: 40;
            box-shadow: 0 12px 24px rgba(212, 175, 55, 0.5);
        }

        .card.selected {
            transform: translateY(-36px) scale(1.1);
            border: 3px solid #f59e0b;
            box-shadow: 0 0 20px #f59e0b;
        }

        /* Gouyu Health Icons */
        .gouyu {
            width: 20px;
            height: 20px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: inline-block;
            transition: all 0.3s ease;
        }
        .gouyu-full { background: linear-gradient(135deg, #10b981, #047857); box-shadow: 0 0 8px #10b981; }
        .gouyu-half { background: linear-gradient(135deg, #f59e0b, #b45309); box-shadow: 0 0 8px #f59e0b; }
        .gouyu-low { background: linear-gradient(135deg, #ef4444, #991b1b); box-shadow: 0 0 8px #ef4444; }
        .gouyu-empty { background: #374151; border: 1px solid #4b5563; }

        /* Floating Damage Text Effect */
        @keyframes damageFloat {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
            30% { opacity: 1; transform: translate(-50%, -30px) scale(1.4); }
            100% { opacity: 0; transform: translate(-50%, -70px) scale(1); }
        }
        .animate-damage {
            animation: damageFloat 1.2s forwards cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        @keyframes cardDrop {
            0% { opacity: 0; transform: scale(2) rotate(-10deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        .animate-card-drop {
            animation: cardDrop 0.35s ease-out forwards;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: #8c6d3f;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none relative">

    <!-- Floating FX Container -->
    <div id="fx-layer" class="pointer-events-none fixed inset-0 z-50 overflow-hidden"></div>

    <!-- Top Navigation / Game Controls -->
    <header class="w-full bg-black/80 border-b border-amber-900/60 px-4 py-2 flex justify-between items-center z-30">
        <div class="flex items-center gap-3">
            <span class="text-2xl font-bold font-calligraphy text-amber-500 tracking-wider">三国杀 1v1</span>
            <span class="text-xs px-2 py-0.5 rounded bg-amber-900/40 border border-amber-600/40 text-amber-200" id="game-mode-tag">标准模式</span>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleAudio()" id="audio-btn" class="px-3 py-1 text-xs bg-amber-900/40 hover:bg-amber-800/60 border border-amber-600/50 rounded text-amber-200 transition">
                🔊 音效: 开
            </button>
            <button onclick="showRuleModal()" class="px-3 py-1 text-xs bg-amber-900/40 hover:bg-amber-800/60 border border-amber-600/50 rounded text-amber-200 transition">
                📜 规则说明
            </button>
            <button onclick="restartGame()" class="px-3 py-1 text-xs bg-red-900/50 hover:bg-red-800/80 border border-red-600/50 rounded text-red-200 transition">
                🔄 重新开始
            </button>
        </div>
    </header>

    <!-- MAIN BATTLE ARENA -->
    <main class="flex-1 flex flex-col justify-between max-w-7xl w-full mx-auto p-2 md:p-4 gap-2 relative">

        <!-- OPPONENT (AI) ZONE -->
        <section id="ai-zone" class="wood-panel rounded-xl p-3 flex flex-col md:flex-row justify-between items-center gap-4 relative">
            <!-- AI Hero Portrait & Info -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="relative">
                    <div id="ai-avatar" class="w-20 h-24 rounded-lg border-2 border-amber-500/60 bg-cover bg-center shadow-lg overflow-hidden flex items-end justify-center relative">
                        <span id="ai-faction" class="absolute top-0 left-0 px-1.5 py-0.5 text-xs font-bold text-white rounded-br bg-wei">魏</span>
                        <div class="w-full bg-black/70 text-center text-xs py-0.5 text-amber-300 font-bold" id="ai-name">曹操</div>
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-amber-400/80">体力</span>
                        <div id="ai-hp-container" class="flex gap-1 items-center">
                            <!-- HP Gouyu dynamic insert -->
                        </div>
                        <span id="ai-hp-text" class="text-xs text-amber-300 font-mono ml-1">4/4</span>
                    </div>

                    <!-- AI Hand Cards Badge -->
                    <div class="flex items-center gap-2 mt-1">
                        <div class="bg-amber-950/80 px-2 py-1 rounded border border-amber-700/50 flex items-center gap-1.5">
                            <span class="text-lg">🎴</span>
                            <span class="text-xs text-amber-200">手牌: <strong id="ai-hand-count" class="text-amber-400 font-mono text-sm">4</strong> 张</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- AI Equipment & Skills -->
            <div class="flex items-center gap-4 w-full md:w-auto justify-end">
                <div class="flex flex-col gap-1 text-xs">
                    <div class="flex items-center gap-1 bg-black/40 px-2 py-1 rounded border border-amber-900/40 w-36">
                        <span class="text-amber-500 font-bold">武器:</span>
                        <span id="ai-equip-weapon" class="text-amber-200/70 truncate">无</span>
                    </div>
                    <div class="flex items-center gap-1 bg-black/40 px-2 py-1 rounded border border-amber-900/40 w-36">
                        <span class="text-amber-500 font-bold">防具:</span>
                        <span id="ai-equip-armor" class="text-amber-200/70 truncate">无</span>
                    </div>
                </div>

                <!-- AI Passive Skill Status -->
                <div id="ai-skill-badge" class="px-2.5 py-1 bg-amber-900/30 border border-amber-600/40 rounded text-xs text-amber-300 font-calligraphy">
                    【奸雄】
                </div>
            </div>
        </section>

        <!-- CENTER BATTLEFIELD & LOGS -->
        <section class="flex-1 grid grid-cols-1 md:grid-cols-12 gap-3 my-1 min-h-[220px]">
            <!-- Left Deck & Phase Area (4 cols) -->
            <div class="md:col-span-3 wood-panel rounded-xl p-3 flex flex-col justify-between items-center text-center">
                <!-- Current Turn Banner -->
                <div id="phase-banner" class="w-full py-1.5 px-3 rounded-lg bg-gradient-to-r from-amber-900 via-amber-700 to-amber-900 text-amber-100 font-bold text-sm tracking-wider border border-amber-400/30 shadow">
                    玩家回合 - 出牌阶段
                </div>

                <!-- Deck & Discard Stack -->
                <div class="flex items-center justify-around w-full my-2">
                    <div class="flex flex-col items-center">
                        <div class="w-14 h-20 bg-gradient-to-br from-amber-900 to-black rounded-lg border-2 border-amber-600/70 flex items-center justify-center shadow-lg relative cursor-default">
                            <span class="text-xl">🎴</span>
                            <span id="deck-count" class="absolute -bottom-2 -right-2 bg-amber-600 text-black font-bold text-xs px-1.5 py-0.5 rounded-full font-mono">84</span>
                        </div>
                        <span class="text-[11px] text-amber-400/80 mt-1">牌堆</span>
                    </div>

                    <div class="flex flex-col items-center">
                        <div id="discard-stack" class="w-14 h-20 bg-black/50 rounded-lg border border-amber-800/40 flex items-center justify-center shadow-inner relative">
                            <span class="text-xs text-amber-700">弃牌堆</span>
                            <span id="discard-count" class="absolute -bottom-2 -right-2 bg-gray-700 text-amber-300 font-bold text-xs px-1.5 py-0.5 rounded-full font-mono">0</span>
                        </div>
                        <span class="text-[11px] text-amber-400/80 mt-1">弃牌</span>
                    </div>
                </div>

                <!-- Step Phase Indicators -->
                <div class="flex justify-between w-full text-[10px] text-amber-500/60 font-bold border-t border-amber-900/40 pt-2">
                    <span id="phase-start">准备</span>
                    <span id="phase-judge">判定</span>
                    <span id="phase-draw">摸牌</span>
                    <span id="phase-play" class="text-amber-300 font-bold">出牌</span>
                    <span id="phase-discard">弃牌</span>
                    <span id="phase-end">结束</span>
                </div>
            </div>

            <!-- Played Cards Stage Area (5 cols) -->
            <div class="md:col-span-5 wood-panel rounded-xl p-3 flex flex-col items-center justify-center relative min-h-[160px]">
                <div class="text-xs text-amber-600/60 absolute top-2 left-3">出牌展示区</div>
                <div id="played-card-stage" class="flex items-center justify-center gap-2">
                    <div class="text-amber-700/40 italic text-sm">等待出牌...</div>
                </div>
            </div>

            <!-- Combat Log Drawer (4 cols) -->
            <div class="md:col-span-4 wood-panel rounded-xl p-2.5 flex flex-col justify-between">
                <div class="text-xs font-bold text-amber-400/90 pb-1 border-b border-amber-900/50 flex justify-between items-center">
                    <span>⚔️ 战局战报</span>
                    <span class="text-[10px] text-amber-600">实时记录</span>
                </div>
                <div id="combat-log" class="flex-1 overflow-y-auto text-[11px] leading-relaxed flex flex-col gap-1 py-1 pr-1 my-1 max-h-36 font-sans">
                    <!-- Logs dynamically appended here -->
                </div>
            </div>
        </section>

        <!-- PLAYER ZONE -->
        <section id="player-zone" class="wood-panel rounded-xl p-3 flex flex-col gap-2 relative border-amber-500/50">
            <div class="flex flex-col md:flex-row justify-between items-center gap-3">
                <!-- Player Hero & Stats -->
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <div id="player-avatar" class="w-20 h-24 rounded-lg border-2 border-amber-400 bg-cover bg-center shadow-lg overflow-hidden flex items-end justify-center relative">
                        <span id="player-faction" class="absolute top-0 left-0 px-1.5 py-0.5 text-xs font-bold text-white rounded-br bg-shu">蜀</span>
                        <div class="w-full bg-black/70 text-center text-xs py-0.5 text-amber-300 font-bold" id="player-name">赵云</div>
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-amber-400/80">体力</span>
                            <div id="player-hp-container" class="flex gap-1 items-center">
                                <!-- Gouyu health icons -->
                            </div>
                            <span id="player-hp-text" class="text-xs text-amber-300 font-mono ml-1">4/4</span>
                        </div>

                        <!-- Player Active Skills Buttons -->
                        <div id="player-skills-container" class="flex gap-1.5 mt-1">
                            <!-- Skill buttons rendered here -->
                        </div>
                    </div>
                </div>

                <!-- Player Equipments & Action Buttons -->
                <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">
                    <!-- Equipments -->
                    <div class="flex flex-col gap-1 text-xs">
                        <div class="flex items-center gap-1 bg-black/40 px-2 py-1 rounded border border-amber-900/40 w-36">
                            <span class="text-amber-500 font-bold">武器:</span>
                            <span id="player-equip-weapon" class="text-amber-200/70 truncate">无</span>
                        </div>
                        <div class="flex items-center gap-1 bg-black/40 px-2 py-1 rounded border border-amber-900/40 w-36">
                            <span class="text-amber-500 font-bold">防具:</span>
                            <span id="player-equip-armor" class="text-amber-200/70 truncate">无</span>
                        </div>
                    </div>

                    <!-- Turn Action Buttons -->
                    <div class="flex gap-2">
                        <button id="btn-play-card" onclick="playSelectedCard()" disabled class="px-4 py-2 text-xs font-bold rounded bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-black border border-amber-300 disabled:opacity-40 disabled:pointer-events-none shadow-md transition">
                            打出卡牌
                        </button>
                        <button id="btn-end-turn" onclick="endPlayerTurn()" class="px-4 py-2 text-xs font-bold rounded bg-gradient-to-r from-red-900 to-red-950 hover:from-red-800 hover:to-red-900 text-red-200 border border-red-600/60 shadow-md transition">
                            结束出牌
                        </button>
                    </div>
                </div>
            </div>

            <!-- Player Hand Cards Area -->
            <div class="pt-2 border-t border-amber-900/40 min-h-[140px] flex justify-center items-end relative overflow-x-auto px-2">
                <div id="player-hand" class="flex gap-2 md:gap-3 py-2 items-end justify-center min-w-max">
                    <!-- Hand cards dynamic render -->
                </div>
            </div>
        </section>
    </main>

    <!-- HERO SELECT MODAL -->
    <div id="hero-select-modal" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
        <div class="wood-panel rounded-2xl p-6 max-w-4xl w-full border-2 border-amber-500 shadow-2xl flex flex-col gap-5 text-center">
            <div>
                <h2 class="text-3xl font-bold font-calligraphy text-amber-400">选择你的出战武将</h2>
                <p class="text-xs text-amber-200/70 mt-1">挑选一位三国名将，开启1v1对决</p>
            </div>

            <div id="hero-options" class="grid grid-cols-1 sm:grid-cols-3 gap-4 my-2">
                <!-- 3 Random Heroes inserted here -->
            </div>

            <button onclick="confirmHeroSelection()" id="btn-confirm-hero" disabled class="self-center px-8 py-2.5 bg-gradient-to-r from-amber-600 to-amber-800 text-black font-bold rounded-lg border border-amber-300 disabled:opacity-40 shadow-lg transition">
                确认出战
            </button>
        </div>
    </div>

    <!-- RESPONSE INTERACTION MODAL -->
    <div id="response-modal" class="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4 hidden">
        <div class="wood-panel rounded-xl p-5 max-w-md w-full border-2 border-amber-500 shadow-2xl flex flex-col gap-4 text-center animate-card-drop">
            <h3 id="response-title" class="text-xl font-bold text-amber-300">防守响应</h3>
            <p id="response-desc" class="text-sm text-amber-100">对手对你使用了【杀】，请打出【闪】进行回避！</p>

            <div id="response-cards-hint" class="text-xs text-amber-400 bg-amber-950/60 p-2 rounded border border-amber-800/50">
                点击手牌中符合条件的牌，然后点击【响应打出】
            </div>

            <div class="flex justify-center gap-3 mt-2">
                <button id="btn-response-confirm" onclick="confirmResponse()" disabled class="px-5 py-2 text-xs font-bold rounded bg-amber-600 hover:bg-amber-500 text-black border border-amber-300 disabled:opacity-40">
                    响应打出
                </button>
                <button id="btn-response-bagua" onclick="triggerBaguaResponse()" class="px-4 py-2 text-xs font-bold rounded bg-blue-900 hover:bg-blue-800 text-blue-200 border border-blue-500 hidden">
                    八卦阵判定
                </button>
                <button id="btn-response-pass" onclick="passResponse()" class="px-5 py-2 text-xs font-bold rounded bg-red-950 hover:bg-red-900 text-red-200 border border-red-700">
                    不打出/承受
                </button>
            </div>
        </div>
    </div>

    <!-- GUANXING MODAL (Zhuge Liang Skill) -->
    <div id="guanxing-modal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 hidden">
        <div class="wood-panel rounded-xl p-5 max-w-lg w-full border border-amber-500 flex flex-col gap-4">
            <h3 class="text-xl font-bold text-amber-300 text-center font-calligraphy">【观星】 - 查看牌堆顶</h3>
            <p class="text-xs text-amber-200/80 text-center">你可以调整牌堆顶3张牌的顺序或置于牌堆底</p>

            <div id="guanxing-cards" class="flex justify-center gap-3 py-3">
                <!-- Guanxing cards display -->
            </div>

            <button onclick="closeGuanxingModal()" class="self-center px-6 py-1.5 bg-amber-600 text-black font-bold text-xs rounded">
                完成调整
            </button>
        </div>
    </div>

    <!-- GAME OVER MODAL -->
    <div id="gameover-modal" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 hidden">
        <div class="wood-panel rounded-2xl p-8 max-w-md w-full border-2 border-amber-500 text-center flex flex-col gap-5 shadow-glow-red">
            <h2 id="gameover-title" class="text-4xl font-bold font-calligraphy text-amber-400">胜利！</h2>
            <p id="gameover-reason" class="text-sm text-amber-200">对方体力耗尽，你获得了最终胜利！</p>
            <button onclick="restartGame()" class="self-center px-8 py-3 bg-amber-600 hover:bg-amber-500 text-black font-bold text-sm rounded-lg border border-amber-300 shadow-lg">
                再战一局
            </button>
        </div>
    </div>

    <script>
        /* ==========================================================================
           1. PROCEDURAL WEB AUDIO ENGINE
           ========================================================================== */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            play(type) {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;

                switch (type) {
                    case 'draw': // Card slide
                        {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(300, now);
                            osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
                            gain.gain.setValueAtTime(0.15, now);
                            gain.gain.linearRampToValueAtTime(0, now + 0.08);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(now);
                            osc.stop(now + 0.08);
                        }
                        break;

                    case 'play': // Card play thud
                        {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(180, now);
                            osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
                            gain.gain.setValueAtTime(0.3, now);
                            gain.gain.linearRampToValueAtTime(0, now + 0.12);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(now);
                            osc.stop(now + 0.12);
                        }
                        break;

                    case 'sha': // Metal slash
                        {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'sawtooth';
                            osc.frequency.setValueAtTime(800, now);
                            osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                            gain.gain.setValueAtTime(0.4, now);
                            gain.gain.linearRampToValueAtTime(0, now + 0.2);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(now);
                            osc.stop(now + 0.2);
                        }
                        break;

                    case 'shan': // Dodge swish
                        {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(400, now);
                            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
                            gain.gain.setValueAtTime(0.2, now);
                            gain.gain.linearRampToValueAtTime(0, now + 0.15);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(now);
                            osc.stop(now + 0.15);
                        }
                        break;

                    case 'tao': // Heal chime arpeggio
                        {
                            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                            notes.forEach((freq, idx) => {
                                const osc = this.ctx.createOscillator();
                                const gain = this.ctx.createGain();
                                osc.type = 'sine';
                                osc.frequency.setValueAtTime(freq, now + idx * 0.06);
                                gain.gain.setValueAtTime(0.15, now + idx * 0.06);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.2);
                                osc.connect(gain);
                                gain.connect(this.ctx.destination);
                                osc.start(now + idx * 0.06);
                                osc.stop(now + idx * 0.06 + 0.2);
                            });
                        }
                        break;

                    case 'damage': // Heavy impact thud
                        {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'square';
                            osc.frequency.setValueAtTime(120, now);
                            osc.frequency.exponentialRampToValueAtTime(30, now + 0.25);
                            gain.gain.setValueAtTime(0.5, now);
                            gain.gain.linearRampToValueAtTime(0, now + 0.25);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(now);
                            osc.stop(now + 0.25);
                        }
                        break;

                    case 'trick': // Magic / Strategy sound
                        {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(300, now);
                            osc.frequency.linearRampToValueAtTime(600, now + 0.3);
                            gain.gain.setValueAtTime(0.2, now);
                            gain.gain.linearRampToValueAtTime(0, now + 0.3);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(now);
                            osc.stop(now + 0.3);
                        }
                        break;

                    case 'win': // Fanfare
                        {
                            const notes = [440, 554.37, 659.25, 880];
                            notes.forEach((f, i) => {
                                const osc = this.ctx.createOscillator();
                                const gain = this.ctx.createGain();
                                osc.frequency.setValueAtTime(f, now + i * 0.1);
                                gain.gain.setValueAtTime(0.2, now + i * 0.1);
                                gain.gain.linearRampToValueAtTime(0, now + i * 0.1 + 0.3);
                                osc.connect(gain);
                                gain.connect(this.ctx.destination);
                                osc.start(now + i * 0.1);
                                osc.stop(now + i * 0.1 + 0.3);
                            });
                        }
                        break;
                }
            }
        }

        /* ==========================================================================
           3. GAME ENGINE STATE
           ========================================================================== */
        class GameEngine {
            constructor() {
                this.deck = [];
                this.discardPile = [];
                this.player = null;
                this.ai = null;
                this.currentTurn = 'player'; // 'player' | 'ai'
                this.phase = 'START';
                this.selectedCardIndex = -1;
                this.shaPlayedThisTurn = 0;
                this.pendingResponse = null; // { source, target, cardType, count, resolve }
                this.selectedHeroChoice = null;
            }

            initDeck() {
                this.deck = [];
                let id = 1;
                // Generate standard set of 108 cards
                for (let i = 0; i < 9; i++) {
                    CARD_TYPES.forEach(tmpl => {
                        const suit = SUITS[Math.floor(Math.random() * SUITS.length)];
                        const val = VALUES[Math.floor(Math.random() * VALUES.length)];
                        const cardColor = (suit === '♥' || suit === '♦') ? 'red' : 'black';
                        this.deck.push({
                            id: id++,
                            ...tmpl,
                            suit,
                            value: val,
                            cardColor
                        });
                    });
                }
                // Shuffle deck
                for (let i = this.deck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.deck[i], this.deck[j]] = [this.deck[j], this.deck[i]];
                }
                this.updateDeckUI();
            }

            drawCard(targetEntity, count = 1) {
                const drawn = [];
                for (let i = 0; i < count; i++) {
                    if (this.deck.length === 0) {
                        this.deck = [...this.discardPile];
                        this.discardPile = [];
                        // Reshuffle
                        for (let k = this.deck.length - 1; k > 0; k--) {
                            const j = Math.floor(Math.random() * (k + 1));
                            [this.deck[k], this.deck[j]] = [this.deck[j], this.deck[k]];
                        }
                        this.log('🃏 牌堆用尽，重新洗牌！');
                    }
                    if (this.deck.length > 0) {
                        const c = this.deck.pop();
                        targetEntity.hand.push(c);
                        drawn.push(c);
                        audio.play('draw');
                    }
                }
                this.updateDeckUI();
                return drawn;
            }

            log(msg, style = 'text-amber-200/90') {
                const logContainer = document.getElementById('combat-log');
                const entry = document.createElement('div');
                entry.className = `${style} fade-in`;
                entry.innerText = msg;
                logContainer.appendChild(entry);
                logContainer.scrollTop = logContainer.scrollHeight;
            }

            updateDeckUI() {
                document.getElementById('deck-count').innerText = this.deck.length;
                document.getElementById('discard-count').innerText = this.discardPile.length;
            }
        }

        function renderGouyu(containerId, currentHp, maxHp) {

                    g.className = 'gouyu gouyu-empty';

        /* ==========================================================================

        function playSelectedCard() {
            if (game.selectedCardIndex === -1 || game.currentTurn !== 'player') return;

            const card = game.player.hand[game.selectedCardIndex];
            executeCardPlay(game.player, game.ai, card, game.selectedCardIndex);
            game.selectedCardIndex = -1;
            renderUI();
        }

        function executeCardPlay(attacker, defender, card, cardIdx) {
            // Remove card from hand
            attacker.hand.splice(cardIdx, 1);
            game.discardPile.push(card);
            game.updateDeckUI();
            stagePlayedCard(card, attacker.hero.name);

            // Process Card Mechanics
            if (card.category === 'equipment') {
                if (card.subtype === 'weapon') attacker.equipments.weapon = card;
                if (card.subtype === 'armor') attacker.equipments.armor = card;
                game.log(`⚔️ ${attacker.hero.name} 装备了【${card.name}】`);
                return;
            }

            if (card.type === 'tao') {
                attacker.heal(1);
                game.log(`🍷 ${attacker.hero.name} 使用了【桃】，回复1点体力`);
                return;
            }

            if (card.type === 'wuzhong') {
                audio.play('trick');
                game.log(`📜 ${attacker.hero.name} 使用了【无中生有】`);
                game.drawCard(attacker, 2);
                return;
            }

            if (card.type === 'chaiqiao') {
                audio.play('trick');
                game.log(`📜 ${attacker.hero.name} 对 ${defender.hero.name} 使用了【过河拆桥】`);
                if (defender.hand.length > 0) {
                    const removed = defender.hand.pop();
                    game.discardPile.push(removed);
                    game.log(`【过河拆桥】弃置了 ${defender.hero.name} 的一张卡牌！`);
                }
                return;
            }

            if (card.type === 'qianyang') {
                audio.play('trick');
                game.log(`📜 ${attacker.hero.name} 对 ${defender.hero.name} 使用了【顺手牵羊】`);
                if (defender.hand.length > 0) {
                    const stolen = defender.hand.pop();
                    attacker.hand.push(stolen);
                    game.log(`【顺手牵羊】获得了 ${defender.hero.name} 的一张卡牌！`);
                }
                return;
            }

            if (card.type === 'sha') {
                audio.play('sha');
                // Check Zhuge Liang Passive: Kongcheng
                if (defender.hero.id === 'zhugeliang' && defender.hand.length === 0) {
                    game.log(`🛡️ 【空城】生效！诸葛亮没有手牌，【杀】对其无效！`, 'text-blue-400');
                    return;
                }

                // Check Renwang Shield
                if (defender.equipments.armor && defender.equipments.armor.type === 'renwang_dun' && card.cardColor === 'black') {
                    game.log(`🛡️ 【仁王盾】生效！黑色【杀】对 ${defender.hero.name} 无效！`, 'text-blue-400');
                    return;
                }

                // Zhang Fei / Zhuge Liannu check
                const isUnlimitedSha = (attacker.hero.id === 'zhangfei') || (attacker.equipments.weapon && attacker.equipments.weapon.type === 'zhuge_liannu');
                if (!isUnlimitedSha) {
                    game.shaPlayedThisTurn++;
                }

                game.log(`⚔️ ${attacker.hero.name} 对 ${defender.hero.name} 使用了【杀】！`);

                // Prompt Response from Defender
                requestResponse(attacker, defender, 'sha', card);
                return;
            }

            if (card.type === 'juedou') {
                audio.play('trick');
                game.log(`⚔️ ${attacker.hero.name} 对 ${defender.hero.name} 发起了【决斗】！`);
                requestResponse(attacker, defender, 'juedou', card);
                return;
            }

            if (card.type === 'nanman') {
                audio.play('trick');
                game.log(`🔥 ${attacker.hero.name} 使用了【南蛮入侵】！`);
                requestResponse(attacker, defender, 'nanman', card);
                return;
            }

            if (card.type === 'wanjian') {
                audio.play('trick');
                game.log(`🏹 ${attacker.hero.name} 使用了【万箭齐发】！`);
                requestResponse(attacker, defender, 'wanjian', card);
                return;
            }
        }

        /* Response Modal Manager */
        function requestResponse(attacker, defender, requestType, sourceCard) {
            if (defender.isAI) {
                // AI Response handling
                setTimeout(() => aiHandleResponse(attacker, defender, requestType, sourceCard), 800);
            } else {
                // Human Player Response Prompt
                game.pendingResponse = { attacker, defender, requestType, sourceCard };
                const modal = document.getElementById('response-modal');
                const title = document.getElementById('response-title');
                const desc = document.getElementById('response-desc');
                const baguaBtn = document.getElementById('btn-response-bagua');

                if (requestType === 'sha' || requestType === 'wanjian') {
                    title.innerText = '🛡️ 攻击应对';
                    desc.innerText = `${attacker.hero.name} 对你使用了【${sourceCard.name}】，请打出【闪】回避！`;
                } else if (requestType === 'nanman' || requestType === 'juedou') {
                    title.innerText = '⚔️ 决斗应对';
                    desc.innerText = `${attacker.hero.name} 对你使用了【${sourceCard.name}】，请打出【杀】迎战！`;
                }

                if (game.player.equipments.armor && game.player.equipments.armor.type === 'bagua_zhen' && (requestType === 'sha' || requestType === 'wanjian')) {
                    baguaBtn.classList.remove('hidden');
                } else {
                    baguaBtn.classList.add('hidden');
                }

                modal.classList.remove('hidden');
            }
        }

        function confirmResponse() {
            if (game.selectedCardIndex === -1 || !game.pendingResponse) return;
            const card = game.player.hand[game.selectedCardIndex];
            const resp = game.pendingResponse;

            let isValid = false;
            if ((resp.requestType === 'sha' || resp.requestType === 'wanjian') && (card.type === 'shan' || (game.player.hero.id === 'zhaoyun' && card.type === 'sha'))) {
                isValid = true;
            }
            if ((resp.requestType === 'nanman' || resp.requestType === 'juedou') && (card.type === 'sha' || (game.player.hero.id === 'zhaoyun' && card.type === 'shan') || (game.player.hero.id === 'guanyu' && card.cardColor === 'red'))) {
                isValid = true;
            }

            if (isValid) {
                game.player.hand.splice(game.selectedCardIndex, 1);
                game.discardPile.push(card);
                game.updateDeckUI();
                audio.play('shan');
                game.log(`🛡️ ${game.player.hero.name} 打出了【${card.name}】，成功应对！`, 'text-green-400');

                // Lu Bu Wushuang logic check
                if (resp.attacker.hero.id === 'lvbu' && resp.requestType === 'sha' && !resp.wushuangSecond) {
                    resp.wushuangSecond = true;
                    game.log(`💥 【无双】生效！你需要再次打出一张【闪】！`, 'text-purple-400');
                    game.selectedCardIndex = -1;
                    renderUI();
                    return;
                }

                closeResponseModal();
            } else {
                game.log(`⚠️ 打出的卡牌不符合要求！`, 'text-red-400');
            }
        }

        function triggerBaguaResponse() {
            if (!game.pendingResponse) return;
            audio.play('trick');
            const judgeCard = game.drawCard(game.player, 1)[0];
            game.discardPile.push(judgeCard);
            game.log(`☯️ 【八卦阵】判定结果：${judgeCard.suit}${judgeCard.value}`, 'text-amber-300');

            if (judgeCard.cardColor === 'red') {
                audio.play('shan');
                game.log(`✅ 判定为红桃/方块，视为成功打出【闪】！`, 'text-green-400');
                closeResponseModal();
            } else {
                game.log(`❌ 判定为黑桃/草花，判定失败！`, 'text-red-400');
            }
        }

        function passResponse() {
            if (!game.pendingResponse) return;
            const resp = game.pendingResponse;
            closeResponseModal();
            resp.defender.takeDamage(1, resp.attacker, resp.sourceCard);
        }

        function closeResponseModal() {
            document.getElementById('response-modal').classList.add('hidden');
            game.pendingResponse = null;
            game.selectedCardIndex = -1;
            renderUI();
        }

        /* ==========================================================================
           6. SMART AI BOT CONTROLLER
           ========================================================================== */
        function startAiTurn() {
            game.currentTurn = 'ai';
            game.phase = 'START';
            updatePhaseUI('START');
            game.shaPlayedThisTurn = 0;

            game.log(`--- 🤖 AI (${game.ai.hero.name}) 回合开始 ---`, 'text-amber-500 font-bold');

            // Draw Phase
            setTimeout(() => {
                game.phase = 'DRAW';
                updatePhaseUI('DRAW');

                let drawCount = 2;
                if (game.ai.hero.id === 'liubei') drawCount = 3; // Liubei extra draw
                game.drawCard(game.ai, drawCount);
                game.log(`🤖 ${game.ai.hero.name} 摸了 ${drawCount} 张牌`);

                // Play Phase
                setTimeout(() => {
                    game.phase = 'PLAY';
                    updatePhaseUI('PLAY');
                    aiPlayLoop();
                }, 1000);
            }, 800);
        }

        function aiPlayLoop() {
            if (game.currentTurn !== 'ai' || game.phase !== 'PLAY') return;

            // 1. Check if HP is low and has Tao
            if (game.ai.hp < game.ai.maxHp) {
                const taoIdx = game.ai.hand.findIndex(c => c.type === 'tao');
                if (taoIdx !== -1) {
                    executeCardPlay(game.ai, game.player, game.ai.hand[taoIdx], taoIdx);
                    renderUI();
                    setTimeout(aiPlayLoop, 1000);
                    return;
                }
            }

            // 2. Play Equipment
            const equipIdx = game.ai.hand.findIndex(c => c.category === 'equipment');
            if (equipIdx !== -1) {
                executeCardPlay(game.ai, game.player, game.ai.hand[equipIdx], equipIdx);
                renderUI();
                setTimeout(aiPlayLoop, 1000);
                return;
            }

            // 3. Play Wuzhong Shengyou
            const wuzhongIdx = game.ai.hand.findIndex(c => c.type === 'wuzhong');
            if (wuzhongIdx !== -1) {
                executeCardPlay(game.ai, game.player, game.ai.hand[wuzhongIdx], wuzhongIdx);
                renderUI();
                setTimeout(aiPlayLoop, 1000);
                return;
            }

            // 4. Play Tricks (Dismantle, Steal, Barbarians, Archery, Duel)
            const trickIdx = game.ai.hand.findIndex(c => ['chaiqiao', 'qianyang', 'nanman', 'wanjian', 'juedou'].includes(c.type));
            if (trickIdx !== -1) {
                executeCardPlay(game.ai, game.player, game.ai.hand[trickIdx], trickIdx);
                renderUI();
                setTimeout(aiPlayLoop, 1000);
                return;
            }

            // 5. Play Sha if permitted
            const canPlaySha = (game.shaPlayedThisTurn < 1) || (game.ai.hero.id === 'zhangfei') || (game.ai.equipments.weapon && game.ai.equipments.weapon.type === 'zhuge_liannu');
            if (canPlaySha) {
                const shaIdx = game.ai.hand.findIndex(c => c.type === 'sha' || (game.ai.hero.id === 'zhaoyun' && c.type === 'shan') || (game.ai.hero.id === 'guanyu' && c.cardColor === 'red'));
                if (shaIdx !== -1) {
                    executeCardPlay(game.ai, game.player, game.ai.hand[shaIdx], shaIdx);
                    renderUI();
                    setTimeout(aiPlayLoop, 1200);
                    return;
                }
            }

            // End AI Turn
            endAiTurn();
        }

        function aiHandleResponse(attacker, defender, requestType, sourceCard) {
            // Check if AI can defend
            let cardIdx = -1;
            if (requestType === 'sha' || requestType === 'wanjian') {
                cardIdx = defender.hand.findIndex(c => c.type === 'shan' || (defender.hero.id === 'zhaoyun' && c.type === 'sha'));
            } else if (requestType === 'nanman' || requestType === 'juedou') {
                cardIdx = defender.hand.findIndex(c => c.type === 'sha' || (defender.hero.id === 'zhaoyun' && c.type === 'shan') || (defender.hero.id === 'guanyu' && c.cardColor === 'red'));
            }

            if (cardIdx !== -1) {
                const c = defender.hand.splice(cardIdx, 1)[0];
                game.discardPile.push(c);
                game.updateDeckUI();
                audio.play('shan');
                game.log(`🛡️ ${defender.hero.name} 打出了【${c.name}】，避开了攻击！`, 'text-green-400');
            } else {
                // AI takes damage
                defender.takeDamage(1, attacker, sourceCard);
            }
            renderUI();
        }

        function endAiTurn() {
            game.phase = 'DISCARD';
            updatePhaseUI('DISCARD');

            // Discard excess cards
            while (game.ai.hand.length > game.ai.hp) {
                const discarded = game.ai.hand.pop();
                game.discardPile.push(discarded);
            }

            // Diaochan Skill: Biyue
            if (game.ai.hero.id === 'diaochan') {
                game.drawCard(game.ai, 1);
                game.log(`【闭月】发动！${game.ai.hero.name} 额外摸了一张牌。`, 'text-purple-400');
            }

            game.phase = 'END';
            updatePhaseUI('END');

            // Pass turn to player
            setTimeout(() => startPlayerTurn(), 800);
        }

        /* Player Turn Controller */
        function startPlayerTurn() {
            game.currentTurn = 'player';
            game.phase = 'START';
            game.shaPlayedThisTurn = 0;
            updatePhaseUI('START');

            game.log(`--- 👤 玩家 (${game.player.hero.name}) 回合开始 ---`, 'text-amber-400 font-bold');

            // Zhuge Liang Guanxing check
            if (game.player.hero.id === 'zhugeliang') {
                showGuanxingModal();
            }

            // Draw Phase
            setTimeout(() => {
                game.phase = 'DRAW';
                updatePhaseUI('DRAW');

                let drawCount = 2;
                if (game.player.hero.id === 'liubei') drawCount = 3;
                game.drawCard(game.player, drawCount);

                // Play Phase
                setTimeout(() => {
                    game.phase = 'PLAY';
                    updatePhaseUI('PLAY');
                    renderUI();
                }, 600);
            }, 600);
        }

        function endPlayerTurn() {
            if (game.currentTurn !== 'player') return;

            // Discard phase check
            if (game.player.hand.length > game.player.hp) {
                const needDiscard = game.player.hand.length - game.player.hp;
                game.log(`⚠️ 手牌上限溢出，自动弃置 ${needDiscard} 张手牌`, 'text-amber-500');
                for (let i = 0; i < needDiscard; i++) {
                    const c = game.player.hand.pop();
                    game.discardPile.push(c);
                }
            }

            // Diaochan Biyue
            if (game.player.hero.id === 'diaochan') {
                game.drawCard(game.player, 1);
                game.log(`【闭月】发动！你额外摸了一张牌。`, 'text-purple-400');
            }

            game.selectedCardIndex = -1;
            renderUI();
            startAiTurn();
        }

        function updatePhaseUI(phaseStr) {
            document.getElementById('phase-banner').innerText = `${game.currentTurn === 'player' ? '玩家' : '电脑'}回合 - ${getPhaseName(phaseStr)}`;
            const phases = ['start', 'judge', 'draw', 'play', 'discard', 'end'];
            phases.forEach(p => {
                const el = document.getElementById(`phase-${p}`);
                if (p === phaseStr.toLowerCase()) {
                    el.className = 'text-amber-300 font-bold underline scale-110 transition';
                } else {
                    el.className = 'text-amber-500/60 font-bold';
                }
            });
        }

        function getPhaseName(p) {
            switch(p) {
                case 'START': return '准备阶段';
                case 'JUDGE': return '判定阶段';
                case 'DRAW': return '摸牌阶段';
                case 'PLAY': return '出牌阶段';
                case 'DISCARD': return '弃牌阶段';
                default: return '结束阶段';
            }
        }

        /* Active Hero Skill Triggers */
        function useZhihengSkill() {
            if (game.selectedCardIndex === -1 || game.currentTurn !== 'player') return;
            const c = game.player.hand.splice(game.selectedCardIndex, 1)[0];
            game.discardPile.push(c);
            game.drawCard(game.player, 1);
            audio.play('trick');
            game.log(`【制衡】发动！弃置1张牌并重新摸了1张牌。`, 'text-amber-400');
            game.selectedCardIndex = -1;
            renderUI();
        }

        function useRendeSkill() {
            if (game.player.hand.length < 2) {
                game.log(`⚠️ 【仁德】需要至少2张手牌才能发动！`, 'text-red-400');
                return;
            }
            game.player.hand.splice(0, 2);
            game.player.heal(1);
            audio.play('tao');
            game.log(`【仁德】发动！转化为【桃】回复了1点体力。`, 'text-green-400');
            game.selectedCardIndex = -1;
            renderUI();
        }

        function showGuanxingModal() {
            const modal = document.getElementById('guanxing-modal');
            const container = document.getElementById('guanxing-cards');
            container.innerHTML = '';
            const cards = game.deck.slice(-3);
            cards.forEach(c => {
                const el = document.createElement('div');
                el.className = 'card w-20 h-28 rounded p-1 border border-amber-600 bg-amber-100 text-black font-bold text-xs flex flex-col justify-between';
                el.innerText = `${c.suit}${c.value} ${c.name}`;
                container.appendChild(el);
            });
            modal.classList.remove('hidden');
        }

        function closeGuanxingModal() {
            document.getElementById('guanxing-modal').classList.add('hidden');
            game.log(`【观星】完成，己掌握天机。`, 'text-blue-300');
        }

        /* Game Over Handling */
        function handleGameOver(winner) {
            audio.play('win');
            const modal = document.getElementById('gameover-modal');
            const title = document.getElementById('gameover-title');
            const reason = document.getElementById('gameover-reason');

            if (game.player.hp > 0) {
                title.innerText = '🎉 胜 利 ！';
                reason.innerText = `你击败了 ${game.ai.hero.name}，一统天下！`;
            } else {
                title.innerText = '☠️ 败 北 ';
                reason.innerText = `你被 ${game.ai.hero.name} 击败，壮志未酬！`;
            }
            modal.classList.remove('hidden');
        }

        function showRuleModal() {
            alert("【三国杀 1v1 简易规则说明】\n1. 摸牌阶段摸2张牌，出牌阶段可使用手牌或装备。\n2. 使用【杀】攻击对方，对方可用【闪】抵挡。\n3. 【桃】可恢复1点体力。\n4. 锦囊牌具有特殊策略效果（决斗、拆桥、牵羊、无中生有等）。\n5. 手牌上限等于当前体力值，回合结束溢出需弃牌。");
        }

        /* Game Reset & Startup */
        function setupHeroSelectScreen() {
            const container = document.getElementById('hero-options');
            container.innerHTML = '';

            // Randomly select 3 heroes
            const shuffled = [...HEROES].sort(() => 0.5 - Math.random()).slice(0, 3);

            shuffled.forEach(h => {
                const card = document.createElement('div');
                card.className = 'wood-panel p-3 rounded-xl border border-amber-600 hover:border-amber-400 cursor-pointer flex flex-col items-center gap-2 transition hover:scale-105';
                card.onclick = () => {
                    document.querySelectorAll('#hero-options > div').forEach(el => el.classList.remove('border-amber-300', 'bg-amber-900/40'));
                    card.classList.add('border-amber-300', 'bg-amber-900/40');
                    game.selectedHeroChoice = h;
                    document.getElementById('btn-confirm-hero').disabled = false;
                };

                card.innerHTML = `
                    <div class="w-20 h-24 rounded border border-amber-500 bg-cover bg-center" style="background-image: url('${h.bg}')"></div>
                    <div class="font-bold text-amber-300 font-calligraphy text-lg">${h.name}</div>
                    <div class="text-[11px] text-amber-200/80 leading-snug">${h.skillDesc}</div>
                `;
                container.appendChild(card);
            });

            document.getElementById('hero-select-modal').classList.remove('hidden');
        }

        function confirmHeroSelection() {
            if (!game.selectedHeroChoice) return;
            document.getElementById('hero-select-modal').classList.add('hidden');

            // Assign Player Hero
            game.player = new Character(game.selectedHeroChoice, false);

            // Assign AI Hero (pick different hero)
            const remaining = HEROES.filter(h => h.id !== game.selectedHeroChoice.id);
            const aiHero = remaining[Math.floor(Math.random() * remaining.length)];
            game.ai = new Character(aiHero, true);

            // Init Deck & Deal starting cards
            game.initDeck();
            game.drawCard(game.player, 4);
            game.drawCard(game.ai, 4);

            renderUI();
            game.log(`⚔️ 战斗开始！${game.player.hero.name} VS ${game.ai.hero.name}`);
            startPlayerTurn();
        }

        function restartGame() {
            document.getElementById('gameover-modal').classList.add('hidden');
            setupHeroSelectScreen();
        }

        // Start game on window load
        window.onload = function() {
            setupHeroSelectScreen();
        };
    </script>
</body>
</html>
